services:
  - type: web
    name: lilysana-education
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: DEV_MODE
        value: "false"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///lilysana.db"
